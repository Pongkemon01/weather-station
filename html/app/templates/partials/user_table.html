<thead>
  <tr>
    <th>Username</th>
    <th>Role</th>
    <th>Created</th>
    <th></th>
  </tr>
</thead>
<tbody>
{% for u in users %}
<tr id="user-row-{{ u.id }}">
  <td>{{ u.username }}</td>
  <td><span class="badge badge-{{ u.role }}">{{ u.role }}</span></td>
  <td>{{ u.created_at.strftime('%Y-%m-%d') if u.created_at else '—' }}</td>
  <td style="white-space:nowrap">
    <button class="btn btn-ghost btn-sm"
            hx-get="/admin/users/{{ u.id }}/edit-modal"
            hx-target="#modal">Edit</button>
    {% if u.id != caller_id %}
    <form style="display:inline"
          hx-post="/admin/users/{{ u.id }}/delete-ui"
          hx-target="#user-row-{{ u.id }}"
          hx-swap="outerHTML"
          hx-confirm="Delete {{ u.username }}?">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn btn-danger btn-sm">Delete</button>
    </form>
    {% endif %}
  </td>
</tr>
{% endfor %}
</tbody>
