# Blue slot upstream — port 8000.
# Managed by scripts/blue_green_deploy.sh; do not edit manually.
# On first blue/green setup: cp this file to /etc/nginx/conf.d/iot_upstream.conf,
# remove the upstream block from iot_server.conf, then: sudo nginx -s reload
upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}
